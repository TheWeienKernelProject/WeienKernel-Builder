name: "Download Clang-r584948"
 runs:
  steps:
    - name: Download AOSP Clang
      run: |
           curl -LO https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android17-release/clang-r584948.tar.gz
      
    - name: make dir for clang unzip
      run: |
           mkdir -p toolchains/clang-r584948
           
    - name: Unzip Clang   
      run: |          
           tar -xf "clang-r584948.tar.gz" -C "toolchains/clang-r584948"    