name: Compile Kernel (Thyme)

on:
  workflow_dispatch: 
jobs:
  Kernel:
    env:
        GH_TOKEN: ${{ github.token }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup SWAP
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16
          
      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
          libssl-dev \
          libelf-dev \
          libdw-dev \
          build-essential \
          dwarves \
          gcc-aarch64-linux-gnu \
          linux-tools-common 
          
      - name: Clone Kernel Source
        run: |
          git clone https://github.com/liuweien339-sys/android_kernel_xiaomi_thyme.git kernel --depth=1 -b thirteen
          
      - name: Download AOSP Clang
        run: |
          curl -LO https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android13-qpr2-release/clang-r450784d.tar.gz

          mkdir -p toolchains/clang
          
          tar -xf "clang-r450784d.tar.gz" -C "toolchains/clang" 

      - name: Include goodies
        run: |
              cd kernel
              curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main || exit 1
              sed -i '179s/error/warning/g' drivers/kernelsu/Kbuild
              sed -i '82s/-dirty//g' drivers/kernelsu/Kbuild
              curl -Lo susfs.patch https://raw.githubusercontent.com/liuweien339-sys/NonGKI_Kernel_Build_2nd/refs/heads/mainline/Patches/Patch/susfs_patch_to_4.19.patch || exit 1
              curl -Lo inline.sh https://raw.githubusercontent.com/liuweien339-sys/NonGKI_Kernel_Build_2nd/refs/heads/mainline/Patches/susfs_inline_hook_patches.sh || exit 1

              patch -p1 < susfs.patch || true
              bash inline.sh || true
              
              touch ./.scmversion
         
      - name: Make Kernel Configs & Build
        run: |
          export PATH="${GITHUB_WORKSPACE}/toolchains/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export KBUILD_BUILD_USER="twkp" 
          export KBUILD_BUILD_HOST="liuweien339-sys"
          
          cd kernel

          make thyme_defconfig susfs_defconfig
          
          make -j$(nproc) Image 2>&1 | tee ${GITHUB_WORKSPACE}/build.log
          
      - name: Make AnyKernel3
        run: |
          ZIP_NAME="Kernel"
          git clone https://github.com/liuweien339-sys/AnyKernel3.git ak3
          cp gauguin/arch/arm64/boot/Image ak3/
          cp build.log ak3/
          cd ak3 

          zip -r9 ../"${ZIP_NAME}.zip" * -x .git

      - name: Upload to GitHub Actions Artifacts
        uses: actions/upload-artifact@v6
        with:
         name: Thymekernel
         path: |
          ak3/*
         if-no-files-found: error
         compression-level: 6
