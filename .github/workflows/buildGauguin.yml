name: Compile Kernel (Gauguin)

on:
  workflow_dispatch:
jobs:
  Kernel:
    env:
        GH_TOKEN: ${{ github.token }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup SWAP
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16
          
      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
          bc bison flex \
          libssl-dev \
          libelf-dev \
          libdw-dev \
          build-essential \
          lz4 \
          git \
          python3 \
          curl \
          dwarves \
          cpio \
          gcc-aarch64-linux-gnu \
          linux-tools-common
          
      - name: Clone Kernel Source
        run: |
          git clone https://github.com/TheWeienKernelProject/android_WeienKernel_xiaomi_gauguin.git gauguin --depth=1 -b lineage-23.2-kernel2.0
          
      - name: Download AOSP Clang
        run: |
          wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android16-qpr2-release/clang-r563880c.tar.gz

          mkdir -p toolchains/clang-r563880c
          
          tar -xf "clang-r563880c.tar.gz" -C "toolchains/clang-r563880c" 

      - name: Include goodies
        run: |
              curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main || exit 1
              sed -i '170s/error/warning/g' drivers/kernelsu/Kbuild
              sed -i '81s/-dirty//g' drivers/kernelsu/Kbuild
              curl -Lo susfs.patch https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/refs/heads/mainline/Patches/Patch/susfs_patch_to_4.19.patch || exit 1
              curl -Lo inline.sh https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/refs/heads/mainline/Patches/susfs_inline_hook_patches.sh || exit 1

              patch -p1 < susfs.patch || true
              bash inline.sh || true

              sed -i '/^#include <linux\/init.h>/a\
              #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\
              #include <linux/susfs_def.h>\
              \
              extern bool susfs_is_current_ksu_domain(void);\
              extern struct static_key_true susfs_is_sdcard_android_data_not_decrypted;\
              \
              #define CL_COPY_MNT_NS 0x00000100\
              #define VFSMOUNT_MNT_FLAGS_KSU_UNSHARED_MNT 0x80000000\
              #define DEFAULT_KSU_MNT_ID 500000\
              #define DEFAULT_KSU_MNT_GROUP_ID 5000\
              #endif' fs/namespace.c
              
              sed -i 's/\.mmap_sem\s*=\s*__RWSEM_INITIALIZER(efi_mm\.mmap_sem)/.mmap_lock = __RWSEM_INITIALIZER(efi_mm.mmap_lock)/' drivers/firmware/efi/efi.c

              touch ./.scmversion
         
      - name: Make Kernel Configs
        run: |
          export PATH="${GITHUB_WORKSPACE}/toolchains/clang-r563880c/bin"
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-

          cd gauguin

          make vendor/lito-perf_defconfig vendor/xiaomi/gauguin.config vendor/addon.config
          
      - name: Build Kernel Image
        run: |
          export PATH="${GITHUB_WORKSPACE}/toolchains/clang-r563880c/bin"
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-

          cd gauguin
          
          make -j$(nproc) Image 2>&1 | tee ${GITHUB_WORKSPACE}/build.log
          
      - name: Make AnyKernel3
        run: |
          ZIP_NAME="kernel"
          git clone https://github.com/liuweien339-sys/AnyKernel3.git ak3
          cp gauguin/arch/arm64/boot/Image ak3/
          cp build.log ak3/
          cd ak3 

          zip -r9 ../"${ZIP_NAME}.zip" * -x .git

      - name: Upload to GitHub Actions Artifacts
        uses: actions/upload-artifact@v6
        with:
         name: kernel
         path: |
          kernel.zip
         if-no-files-found: error
         compression-level: 6
