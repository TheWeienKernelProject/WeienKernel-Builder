name: Compile Kernel (SM8150)

on:
  workflow_dispatch:
jobs:
  Kernel:
    env:
        GH_TOKEN: ${{ github.token }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup SWAP
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16
          
      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
          libssl-dev \
          libelf-dev \
          libdw-dev \
          build-essential \
          dwarves \
          gcc-aarch64-linux-gnu \
          linux-tools-common 
          
      - name: Clone Kernel Source
        run: |
          git clone https://github.com/liuweien339-sys/android_kernel_oneplus_sm8150/ --depth=1 -b lineage-23.2 sm8150
          
      - name: Download AOSP Clang
        run: |
          curl -LO  https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android16-qpr2-release/clang-r563880c.tar.gz

          mkdir -p toolchains/clang-r563880c
          
          tar -xf "clang-r563880c.tar.gz" -C "toolchains/clang-r563880c" 

      - name: Include goodies
        run: |
              cd sm8150
              
              curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/msater/kernel/setup.sh" | bash -s main || exit 1

              touch ./.scmversion
         
      - name: Make Kernel Configs
        run: |
          export PATH="${GITHUB_WORKSPACE}/toolchains/clang-r563880c/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-

          cd sm8150

          make vendor/sm8150-perf_defconfig vendor/oplus.config vendor/addon.config
          
      - name: Build Kernel Image
        run: |
          export PATH="${GITHUB_WORKSPACE}/toolchains/clang-r563880c/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-

          cd sm8150
          
          make -j$(nproc) Image 2>&1 | tee ${GITHUB_WORKSPACE}/build.log
          
      - name: Make AnyKernel3
        run: |
          ZIP_NAME="Kernel"
          git clone https://github.com/liuweien339-sys/AnyKernel3.git ak3
          cp sm8150/arch/arm64/boot/Image ak3/
          cp build.log ak3/
          cd ak3 

          zip -r9 ../"${ZIP_NAME}.zip" * -x .git

      - name: Upload to GitHub Actions Artifacts
        uses: actions/upload-artifact@v6
        with:
         name: SM8150kernel
         path: |
          ak3/*
         if-no-files-found: error
         compression-level: 6
