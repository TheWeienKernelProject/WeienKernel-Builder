name: Compile Kernel (Gauguin)

on:
  workflow_dispatch: 
jobs:
  Kernel:
    env:
        GH_TOKEN: ${{ github.token }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup SWAP
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16
          
      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
          libssl-dev \
          libelf-dev \
          libdw-dev \
          build-essential \
          dwarves \
          gcc-aarch64-linux-gnu \
          linux-tools-common 
          
      - name: Clone Kernel Source
        run: |
          git clone https://github.com/rrrrrUDE/android_kernel_xiaomi_gauguin.git gauguin --depth=1 -b testbranch
          
      - name: Download AOSP Clang
        run: |
          curl -LO  https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android16-qpr2-release/clang-r563880c.tar.gz

          mkdir -p toolchains/clang-r563880c
          
          tar -xf "clang-r563880c.tar.gz" -C "toolchains/clang-r563880c" 

      - name: Make Kernel Configs
        run: |
          export PATH="${GITHUB_WORKSPACE}/toolchains/clang-r563880c/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export KBUILD_BUILD_USER="twkp" 
          export KBUILD_BUILD_HOST="liuweien339-sys"
          
          cd gauguin

          make gauguin_defconfig

      - name: Build Kernel Image
        run: |
          export PATH="${GITHUB_WORKSPACE}/toolchains/clang-r563880c/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-

          cd gauguin
          
          make -j$(nproc) Image 2>&1 | tee ${GITHUB_WORKSPACE}/build.log
          
      - name: Make AnyKernel3
        run: |
          ZIP_NAME="Kernel"
          git clone https://github.com/liuweien339-sys/AnyKernel3.git ak3
          cp gauguin/arch/arm64/boot/Image ak3/
          cp build.log ak3/
          cd ak3 

          zip -r9 ../"${ZIP_NAME}.zip" * -x .git

      - name: Upload to GitHub Actions Artifacts
        uses: actions/upload-artifact@v6
        with:
         name: Gauguinkernel
         path: |
          ak3/*
         if-no-files-found: error
         compression-level: 6
