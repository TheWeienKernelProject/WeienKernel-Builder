name: Compile Kernel PYS110

on:
  workflow_dispatch:
jobs:
  Kernel:
    env:
        GH_TOKEN: ${{ github.token }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup SWAP
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16
          
      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
          libssl-dev \
          libelf-dev \
          libdw-dev \
          build-essential \
          dwarves \
          gcc-aarch64-linux-gnu \
          linux-tools-common 
          
      - name: Clone Kernel Source
        run: |
          git clone https://github.com/liuweien339-sys/android_WeienKernel_oneplus_mt6878.git --depth=1 -b oneplus/mt6878_b_16.0_turbo_6x mt6878
          git clone https://github.com/liuweien339-sys/android_WeienKernel_modules_and_devicetree_oneplus_mt6878 --depth=1 -b oneplus/mt6878_b_16.0_turbo_6x modules
          cp -r ${GITHUB_WORKSPACE}/modules/vendor ${GITHUB_WORKSPACE}/ 
          cp -r ${GITHUB_WORKSPACE}/modules/kernel ${GITHUB_WORKSPACE}/
          
      - name: Download AOSP Clang
        run: |
              curl -LO https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android14-qpr3-release/clang-r487747c.tar.gz

              mkdir ${GITHUB_WORKSPACE}/clang/
              
              tar -xf "clang-r487747c.tar.gz" -C "${GITHUB_WORKSPACE}/clang/
              
      - name: Include DroidSpaces Patch
        run: |
              # cd mt6878
              # curl -Lo ds.patch https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/refs/heads/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch  1
              # patch -p1 < ds.patch

      - name: Make Confiig & Build Kernel Image
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang/clang-r487747c/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
            
          cd mt6878
          make turbo6x-mt6878_defconfig
          make -j$(nproc) Image 2>&1 | tee ${GITHUB_WORKSPACE}/build.log

      - name: Make AnyKernel3
        run: |
          ZIP_NAME="kernel"
          git clone https://github.com/liuweien339-sys/AnyKernel3.git ak3
          cp mt6878/arch/arm64/boot/Image ak3/
          cp build.log ak3/
          cd ak3 

          zip -r9 ../"${ZIP_NAME}.zip" * -x .git

      - name: Upload to GitHub Actions Artifacts
        uses: actions/upload-artifact@v7
        with:
         name: Turbo6XKernel
         path: |
          ak3/*
         if-no-files-found: error
         compression-level: 6
