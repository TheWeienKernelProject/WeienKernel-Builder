name: Make SaveConfig

on:
  workflow_dispatch:
jobs:
  Kernel:
    env:
        GH_TOKEN: ${{ github.token }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup SWAP
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16
          
      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
          libssl-dev \
          libelf-dev \
          libdw-dev \
          build-essential \
          dwarves \
          gcc-aarch64-linux-gnu \
          linux-tools-common 
          
      - name: Clone Kernel Source
        run: |
          git clone https://github.com/liuweien339-sys/android_WeienKernel_oneplus_mt6878.git --depth=1 -b oneplus/mt6878_b_16.0_turbo_6x mt6878
          
      - name: Download AOSP Clang
        run: |
              curl -LO https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android14-qpr3-release/clang-r487747c.tar.gz

              mkdir -p toolchains/clang-r487747c
          
              tar -xf "clang-r487747c.tar.gz" -C "toolchains/clang-r487747c"
              
      - name: Make Config
        run: |
          
          cd mt6878
          make turbo6x-mt6878_defconfig
          make savedefconfig
          
      - name: Upload to GitHub Actions Artifacts
        uses: actions/upload-artifact@v7
        with:
         name: Turbo6XKernel
         path: |
          mt6878/defconfig
         if-no-files-found: error
         compression-level: 6
